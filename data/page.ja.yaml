explanation:
  title: 研究で扱う自律移動のしくみ
  steps:
    - title: 経路を探す
      body: ロボットの大きさと障害物との余裕幅を考慮し、3次元の格子上でA*探索を行います。
    - title: 経路から最適な軌道を生成
      body: 経路を短縮し、ロボットの推力や機体特性を考慮して、最適な速度で移動できる軌道を生成します。
    - title: 軌道に沿って移動
      body: 生成された軌道にある速度や加速度の情報をもとに、ロボットを制御して移動します。
